name: forma-store
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-store}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-store}
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 15
  migrate:
    build:
      context: .
      target: api
    image: forma-api:local
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-store}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-store}?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: ['sh', '-c', 'npm run db:migrate && npm run db:seed']
  api:
    build:
      context: .
      target: api
    image: forma-api:local
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-store}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-store}?schema=public
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3100}
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    init: true
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:3100:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
